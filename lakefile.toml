name = "assay"
defaultTargets = ["Assay"]
testDriver = "AssayTest"

[[require]]
name = "plausible"
git = "https://github.com/leanprover-community/plausible"
rev = "v4.35.0"

[[lean_lib]]
name = "Assay"

[[lean_lib]]
name = "Examples"
globs = ["Examples.+"]

[[lean_lib]]
name = "AssayTest"
globs = ["AssayTest.+"]
